<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Security -->
    <meta name="referrer" content="strict-origin-when-cross-origin" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'self'; form-action 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' blob: https://cdn.jsdelivr.net https://unpkg.com https://static.cloudflareinsights.com; worker-src 'self' blob:; child-src 'self' blob:; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://unpkg.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: blob: https:; connect-src 'self' blob: data: https://*.supabase.co wss://*.supabase.co https://cdn.jsdelivr.net https://unpkg.com https://tessdata.projectnaptha.com https://*.tile.openstreetmap.org https://nominatim.openstreetmap.org https://cloudflareinsights.com; frame-src 'self' https://*.supabase.co; upgrade-insecure-requests"
    />

    <!-- Primary SEO -->
    <title>Ntlo | Student Accommodation in Botswana</title>
    <meta name="description" content="Ntlo helps Botswana students find verified rooms and apartments near UB, BIUST, Botho, BA ISAGO, and more. Browse listings, compare prices, and contact landlords — free for students." />
    <meta name="keywords" content="Ntlo, student accommodation Botswana, rooms near university, UB student housing, BIUST accommodation, Botho University rooms, Gaborone student rooms, Botswana rentals, campus housing" />
    <meta name="author" content="Futurify Designs" />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://ntlo.online/" />

    <!-- Theme & PWA -->
    <meta name="theme-color" content="#1A1A2E" />
    <meta name="color-scheme" content="light" />
    <meta name="application-name" content="Ntlo" />
    <meta name="apple-mobile-web-app-title" content="Ntlo" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="mobile-web-app-capable" content="yes" />
    <link rel="manifest" href="/manifest.json" />

    <!-- Icons (Google search favicon + browsers) -->
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="48x48" href="/favicon-48.png" />
    <link rel="icon" type="image/png" sizes="96x96" href="/favicon-96.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/favicon-192.png" />
    <link rel="shortcut icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Ntlo" />
    <meta property="og:title" content="Ntlo | Student Accommodation in Botswana" />
    <meta property="og:description" content="Find verified student rooms near Botswana universities. Your campus home, sorted." />
    <meta property="og:url" content="https://ntlo.online/" />
    <meta property="og:image" content="https://ntlo.online/logo-brand.png" />
    <meta property="og:image:alt" content="Ntlo — student accommodation in Botswana" />
    <meta property="og:locale" content="en_BW" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Ntlo | Student Accommodation in Botswana" />
    <meta name="twitter:description" content="Find verified student rooms near Botswana universities. Your campus home, sorted." />
    <meta name="twitter:image" content="https://ntlo.online/logo-brand.png" />
    <meta name="twitter:image:alt" content="Ntlo logo" />

    <!-- Structured data -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@graph": [
        {
          "@type": "Organization",
          "@id": "https://ntlo.online/#organization",
          "name": "Ntlo",
          "alternateName": ["Ntlo Online", "Ntlo Botswana"],
          "url": "https://ntlo.online/",
          "logo": {
            "@type": "ImageObject",
            "url": "https://ntlo.online/favicon-192.png",
            "width": 192,
            "height": 192
          },
          "image": "https://ntlo.online/logo-brand.png",
          "description": "Ntlo helps Botswana students find verified rooms and apartments near their universities.",
          "areaServed": {
            "@type": "Country",
            "name": "Botswana"
          },
          "founder": {
            "@type": "Organization",
            "name": "Futurify Designs"
          }
        },
        {
          "@type": "WebSite",
          "@id": "https://ntlo.online/#website",
          "name": "Ntlo",
          "alternateName": "Ntlo Botswana",
          "url": "https://ntlo.online/",
          "description": "Student accommodation finder for Botswana universities.",
          "publisher": { "@id": "https://ntlo.online/#organization" },
          "inLanguage": "en",
          "potentialAction": {
            "@type": "SearchAction",
            "target": "https://ntlo.online/#/listings?q={search_term_string}",
            "query-input": "required name=search_term_string"
          }
        }
      ]
    }
    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Syne:wght@500;600;700;800&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
