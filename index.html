    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@graph": [
        {
          "@type": "Organization",
          "@id": "https://ntlo.online/#organization",

          "alternateName": ["Ntlo Online", "Ntlo Botswana"],
          "url": "https://ntlo.online/",
          "logo": {

            "url": "https://ntlo.online/favicon-512.png",

            "height": 512
          },

          "description": "Ntlo helps Botswana students find verified rooms and apartments near their universities.",

          },

            "@type": "Organization",
            "name": "Futurify Designs"
          }
        },
        {
          "@type": "WebSite",
          "@id": "https://ntlo.online/#website",
          "name": "Ntlo",
          "alternateName": "Ntlo Botswana",
          "url": "https://ntlo.online/",
          "description": "Student accommodation finder for Botswana universities.",
          "publisher": { "@id": "https://ntlo.online/#organization" },
          "inLanguage": "en",
          "potentialAction": {
            "@type": "SearchAction",
            "target": "https://ntlo.online/listings?q={search_term_string}",
            "query-input": "required name=search_term_string"
          }
        }
      ]

  <body>
    <script>
      ;(function () {
        var hash = window.location.hash || ''
        if (hash.indexOf('#/') === 0) {
          history.replaceState(null, '', hash.slice(1) + window.location.search)
          return
        }
        var redirect = sessionStorage.getItem('ntlo_spa_redirect')
        if (!redirect) return
        sessionStorage.removeItem('ntlo_spa_redirect')
        if (redirect !== window.location.pathname + window.location.search) {
          history.replaceState(null, '', redirect)
        }
      })()
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
