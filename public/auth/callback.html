<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="referrer" content="strict-origin-when-cross-origin" />
  <meta http-equiv="Permissions-Policy" content="geolocation=(), camera=(), microphone=(), payment=(), usb=()" />
  <meta
    http-equiv="Content-Security-Policy"
    content="default-src 'self'; base-uri 'self'; object-src 'none'; form-action 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self' data:; img-src 'self' data:; connect-src 'self' https://*.supabase.co wss://*.supabase.co; upgrade-insecure-requests"
  />
  <title>Signing you in — Ntlo</title>
  <link rel="icon" type="image/png" href="../favicon.png" sizes="512x512" />
  <link rel="stylesheet" href="auth-shared.css" />
</head>
<body>
  <div class="bg-mesh"></div>
  <div class="card">
    <img class="logo" src="../logo-brand.png" alt="Ntlo" />

    <div id="state-loading">
      <div class="icon-wrap loading"><div class="spinner"></div></div>
      <h1>Signing you in</h1>
      <p>Please wait while we connect your Google account.</p>
    </div>

    <div id="state-unverified" class="hidden">
      <div class="icon-wrap loading"><div class="spinner"></div></div>
      <h1>Verify your email</h1>
      <p>Your Google account needs email confirmation before you can use Ntlo.</p>
      <p class="note">Redirecting you to the verification page…</p>
    </div>

    <div id="state-error" class="hidden">
      <div class="icon-wrap error">!</div>
      <h1>Sign-in failed</h1>
      <p id="error-message">Something went wrong. Please try again.</p>
      <a class="link" id="error-link" href="../#/login">Back to sign in</a>
    </div>
  </div>

  <script src="config.js"></script>
  <script type="module" src="callback.js"></script>
</body>
</html>
