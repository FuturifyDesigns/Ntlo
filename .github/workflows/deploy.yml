name: Deploy to GitHub Pages

on:
  push:
    branches: [main, master]
  workflow_dispatch:
  # Auto-sync commits use GITHUB_TOKEN and do not trigger push workflows.
  workflow_run:
    workflows: ['Sync web student rentals']
    types: [completed]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      # Use the committed feed from the daily sync workflow — do not re-scrape
      # during Pages builds (that job is slow and often gets cancelled).
      - run: npm run build:fast
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_GOOGLE_MAPS_API_KEY: ${{ secrets.VITE_GOOGLE_MAPS_API_KEY }}
          # Intentionally omit VITE_GOOGLE_MAPS_MAP_ID — Map IDs (incl. DEMO_MAP_ID
          # and the old Cloud Console ID) render solid blue on this project.
          # Re-enable only with a verified Map ID + VITE_GOOGLE_MAPS_USE_CLOUD_STYLING=true.

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url || steps.deployment-2.outputs.page_url || steps.deployment-3.outputs.page_url }}
    steps:
      # Pages backend sometimes returns "Deployment failed, try again later."
      # Retry the same uploaded artifact before failing the workflow.
      - id: deployment
        uses: actions/deploy-pages@v4
        continue-on-error: true

      - name: Back off before retry
        if: steps.deployment.outcome == 'failure'
        run: sleep 30

      - id: deployment-2
        if: steps.deployment.outcome == 'failure'
        uses: actions/deploy-pages@v4
        continue-on-error: true

      - name: Back off before final retry
        if: steps.deployment.outcome == 'failure' && steps.deployment-2.outcome == 'failure'
        run: sleep 60

      - id: deployment-3
        if: steps.deployment.outcome == 'failure' && steps.deployment-2.outcome == 'failure'
        uses: actions/deploy-pages@v4
